name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # scoped to this job: only the GitHub Release needs to write
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
      - name: Build sdist and wheel
        run: uv build
      - name: Check Build Artifacts
        run: ls -la dist/
      - name: Create GitHub Release
        # The workflow previously stopped after `ls dist/`, so tagged builds
        # were collected and discarded. Attach the artifacts to a release so
        # the tag actually publishes something.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
