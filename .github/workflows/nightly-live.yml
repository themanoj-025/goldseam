name: Nightly Live Provider Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    if: github.repository == 'themanoj-025/goldseam'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --extra llm
      - name: Run Opt-In Live Evaluation with Hard Spend Cap
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOLDSEAM_SPEND_CAP_USD: "0.50"
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            uv run pytest tests/integration/test_live_providers.py -v
          else
            echo "No live API keys configured; skipping nightly live tests."
          fi
