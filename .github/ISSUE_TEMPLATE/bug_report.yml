name: Bug Report
description: Create a report to help us fix a reproducible defect
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please verify against the latest release.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands, trace logs, or steps to reproduce the behavior.
      placeholder: |
        1. Run 'goldseam compile ...'
        2. Inspect output in ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to the specification.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Operating system, Python version, Docker version.
      value: |
        - OS: [e.g. Ubuntu 22.04 / Windows 11]
        - Python version: [e.g. 3.12.3]
        - Goldseam version: [e.g. 0.1.0]
    validations:
      required: true
