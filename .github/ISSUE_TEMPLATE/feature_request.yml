name: Feature Request
description: Suggest an idea or enhancement for Goldseam
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an improvement to the Goldseam compiler!
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: What feature or enhancement are you proposing?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Solved
      description: What problem or use case does this solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative solutions or workarounds you have considered.
