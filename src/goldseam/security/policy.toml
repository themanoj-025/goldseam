# Goldseam Security Policy Specification

[policy]
version = "1.0.0"
default_preset = "strict"

[presets.strict]
description = "Strict isolation for untrusted generated code: pure computational libraries only"
allowed_modules = [
    "json", "csv", "re", "math", "datetime", "collections",
    "itertools", "functools", "typing", "dataclasses", "enum",
    "pathlib", "hashlib", "uuid", "copy", "string", "unicodedata",
    "io", "urllib.parse", "decimal", "fractions", "bisect", "heapq"
]
allow_workspace_read = false
allow_workspace_write = false
allow_network = false

[presets.standard]
description = "Standard operational profile: computational libraries plus controlled local I/O"
allowed_modules = [
    "json", "csv", "re", "math", "datetime", "collections",
    "itertools", "functools", "typing", "dataclasses", "enum",
    "pathlib", "hashlib", "uuid", "copy", "string", "unicodedata",
    "io", "urllib.parse", "decimal", "fractions", "bisect", "heapq",
    "tempfile"
]
allow_workspace_read = true
allow_workspace_write = true
allow_network = false

[presets.permissive]
description = "Permissive development profile (strictly for verified trusted fixtures)"
allowed_modules = [
    "json", "csv", "re", "math", "datetime", "collections",
    "itertools", "functools", "typing", "dataclasses", "enum",
    "pathlib", "hashlib", "uuid", "copy", "string", "unicodedata",
    "io", "urllib.parse", "decimal", "fractions", "bisect", "heapq",
    "tempfile", "os", "shutil"
]
allow_workspace_read = true
allow_workspace_write = true
allow_network = false

[forbidden]
calls = [
    "eval", "exec", "__import__", "compile", "globals", "locals",
    "vars", "dir", "breakpoint", "input", "getattr", "setattr", "delattr",
    "open", "memoryview"
]
attributes = [
    "__class__", "__bases__", "__subclasses__", "__mro__", "__globals__",
    "__code__", "__dict__", "__closure__", "__func__", "__self__",
    "__builtins__", "__import__", "__loader__", "__spec__"
]
modules = [
    "os", "sys", "subprocess", "shutil", "socket", "http", "urllib.request",
    "ctypes", "inspect", "importlib", "builtins", "pickle", "shelve",
    "marshal", "multiprocessing", "threading", "concurrent", "asyncio",
    "posix", "nt", "pty", "commands", "runpy", "webbrowser"
]

[secrets]
entropy_threshold = 4.2
min_token_length = 20
patterns = [
    "(?i)bearer\\s+[a-z0-9_\\-\\.]+",
    "(?i)(?:api_key|apikey|secret|password|access_token)\\s*[:=]\\s*[\"']?[a-z0-9_\\-\\.]+[\"']?",
    "sk-[a-zA-Z0-9]{20,}",
    "ghp_[a-zA-Z0-9]{36}",
    "gho_[a-zA-Z0-9]{36}",
    "AKIA[0-9A-Z]{16}",
    "-----BEGIN\\s+(?:RSA|OPENSSH|EC|DSA)?\\s*PRIVATE\\s+KEY-----",
]
