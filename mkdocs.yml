site_name: Goldseam
site_description: Failure-to-Skill Compiler for Autonomous Agents
site_url: https://github.com/themanoj-025/goldseam
repo_url: https://github.com/themanoj-025/goldseam
repo_name: themanoj-025/goldseam

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Core Concepts: getting-started/concepts.md
  - Architecture:
      - Overview: architecture/overview.md
      - Ingestion Adapters: architecture/adapters.md
      - Sandbox Backends: architecture/backends.md
  - Security:
      - Threat Model: security/threat-model.md
      - Security Policy: security/policy.md
  - Reference:
      - CLI Reference: reference/cli.md
      - Agent Skills Spec: reference/agent-skills-spec.md
      - MCP Protocol Spec: reference/mcp-spec.md
  - Benchmarks:
      - Methodology: benchmarks/methodology.md
  - Architecture Decisions:
      - Key Decisions: adr/index.md
      - ADR 0001: adr/0001-record-architecture-decisions.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: "!!python/name:pymdownx.superfences.fence_code_format"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
